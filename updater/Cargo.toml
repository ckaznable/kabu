[package]
name = "kabu-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
kabu-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
