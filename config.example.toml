[server]
port = 8100
database_url = "sqlite:kabu.db"

[finnhub]
# Set api_key directly, or set api_key_env to read from an environment variable
api_key = ""
api_key_env = "FINNHUB_API_KEY"

[gemini]
# Set api_key directly, or set api_key_env to read from an environment variable
api_key = ""
api_key_env = "GEMINI_API_KEY"
model = "gemini-2.5-flash-lite"

[exchange_rate]
# exchangerate-api.com
api_key = ""
api_key_env = "EXCHANGE_RATE_API_KEY"
base = "USD"
currencies = ["TWD", "JPY", "EUR"]

[coinmarketcap]
# For crypto prices — get a free key at https://coinmarketcap.com/api/
api_key = ""
api_key_env = "CMC_API_KEY"

[pdf]
# PDF decryption password (for encrypted financial statements)
# Set password directly, or set password_env to read from an environment variable
password = ""
password_env = "PDF_PASSWORD"
